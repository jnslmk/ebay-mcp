[project]
name = "ebay-mcp"
version = "0.2.0"
description = "MCP server for eBay listing search via the Browse API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=3.4.4",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
ebay-mcp = "ebay_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ebay_mcp"]
